name: Build Fabric Client
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: List files
        run: ls -la
      - name: Extract source
        run: unzip -o Zalith-ARM64-Source-Fix.zip -d source
      - name: Find Gradle
        run: find source -name gradlew -type f
      - name: Build
        shell: bash
        run: |
          GRADLEW="$(find source -name gradlew -type f | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Fabric-Client-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
