name: Build Fabric Client

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Build project
    run: |
      unzip -o Zalith-ARM64-Source-Fix.zip -d source
      cd source
      find . -name gradlew -type f
      GRADLEW=$(find . -name gradlew -type f | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "Khong tim thay gradlew trong ZIP"
        exit 1
      fi
      chmod +x "$GRADLEW"
      cd "$(dirname "$GRADLEW")"
      ./gradlew build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: Fabric-Client-JAR
      path: source/**/build/libs/*.jar
      if-no-files-found: error
